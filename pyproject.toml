[build-system]
requires = ["setuptools>=77.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# the version comes from the git tag (vX.Y.Z); a missing tag gives 0.1.devN

[project]
name = "dolmos"
description = "A symbolic testing tool for EVM smart contracts"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ethereum", "evm", "solidity", "vyper", "symbolic-execution", "formal-verification", "foundry"]
# dolmos is derived from other authors' work, see NOTICE
authors = [
    { name="Dowsers SAS" },
]
maintainers = [
    { name="Dowsers SAS" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
    "sortedcontainers>=2.4.0",
    "toml>=0.10.2",
    "z3-solver==4.12.6.0",
    "eth_hash[pysha3]>=0.7.0",
    "rich>=14.0.0,<14.1.0",
    "xxhash>=3.5.0",
    "psutil>=6.1.0",
    "requests>=2.32.3",
    "yices-solver>=2.6.4,<2.6.5",
    "python-dotenv>=1.1.0",
]
dynamic = ["version"]

[project.scripts]
dolmos = "dolmos.__main__:main"

[project.urls]
"Homepage" = "https://github.com/Dowsers/dolmos"
"Documentation" = "https://github.com/Dowsers/dolmos/blob/main/docs/getting-started.md"
"Issues" = "https://github.com/Dowsers/dolmos/issues"
"Changelog" = "https://github.com/Dowsers/dolmos/blob/main/CHANGELOG.md"

# development dependencies, can be installed with
#   uv sync --extra dev
# or
#   pip install -e ".[dev]"
# (see CONTRIBUTING.md for more details)
[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "pytest-github-actions-annotate-failures>=0.3.0",
    "ruff>=0.8.1",
]

[tool.pytest.ini_options]
# TODO: re-add test_traces.py when we have a better way to support it in CI
addopts = "--ignore=tests/lib --ignore=tests/test_traces.py"
# addopts = "--ignore=tests/lib"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "SIM",# flake8-simplify
    "I",  # isort
]
ignore = [
    "E501",  # line too long
]
exclude = [
    "tests/lib/**"
]
