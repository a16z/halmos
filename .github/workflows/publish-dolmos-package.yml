# based on https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions#upgrading-a-workflow-that-accesses-a-registry-using-a-personal-access-token
name: Push dolmos package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Push dolmos-builder package"]
    types:
      - completed
  push:
    paths:
      - packages/dolmos/**/*
      - .github/workflows/publish-dolmos-package.yml
    tags:
      # push when we release a new tagged version
      - 'v*'

env:
  IMAGE_NAME: dolmos

jobs:
  # This pushes the image to GitHub Packages.
  push:
    # if triggered by a workflow_run, only run if the previous workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6
        with:
          # we may need tests/lib for the workflows using this image
          submodules: recursive

      - name: Build image
        run: docker build . --file packages/dolmos/Dockerfile --tag $IMAGE_NAME --label "runnumber=${GITHUB_RUN_ID}"

      - name: Print dolmos version
        run: docker run $IMAGE_NAME dolmos --version

      - name: Push image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME

          # This changes all uppercase characters to lowercase.
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # release: X.Y.Z, X.Y and latest
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$VERSION ${VERSION%.*} latest"
          else
            # anything else (main, builder rebuilds): a moving `main` tag
            TAGS="main"
          fi

          for TAG in $TAGS; do
            echo "pushing $IMAGE_ID:$TAG"
            docker tag $IMAGE_NAME $IMAGE_ID:$TAG
            docker push $IMAGE_ID:$TAG
          done
