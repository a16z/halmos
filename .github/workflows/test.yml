name: Test

on:
  push:
    branches: [main, chore-workflows]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dolmos-options:
        description: "additional dolmos options"
        required: false
        type: string
        default: ""
      pytest-options:
        description: "additional pytest options"
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      DOLMOS_ALLOW_DOWNLOAD: 1

    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13"]
        storage-layout: ["solidity", "generic"]
        cache-solver: ["", "--cache-solver"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # note: it is faster to let foundry do a sparse checkout of the missing libraries rather than having the action do a git checkout of the submodules
          submodules: false

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Print foundry version
        run: forge --version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: "0.5.21"

      - name: Set up python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dolmos and its dependencies
        run: |
          uv sync --extra dev

      - name: Write dolmos.toml
        shell: bash
        run: |
          uv run python -m dolmos.config \
            --storage-layout ${{ matrix.storage-layout }} \
            ${{ matrix.cache-solver }} \
            | tee tests/regression/dolmos.toml

      - name: Run pytest
        shell: bash
        run: |
          # failed tests are reported as annotations on the run page (readable without
          # signing in, pytest-github-actions-annotate-failures in the dev extras), and
          # summarized at the end of the log (-rfE).
          # no `uv run --with`: it runs pytest in an overlay environment, where dolmos
          # does not find z3.exe (installed in .venv\bin, not on PATH, on Windows)
          uv run pytest -v -rfE -k "not long and not ffi" --ignore=tests/lib \
            --dolmos-options="-st --disable-gc --solver-threads 1 ${{ inputs.dolmos-options }}" ${{ inputs.pytest-options }}
