name: Publish to PyPI

# Triggered by publishing a GitHub Release whose tag is vX.Y.Z.
# The package version comes from that tag (setuptools-scm).

on:
  release:
    types: [published]
  # manual dry run: builds and checks the distributions, publishes nothing
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # setuptools-scm needs the tags and the history
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Check that the version matches the tag
        if: github.event_name == 'release'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            dist/dolmos-${expected}-*) echo "version $expected OK" ;;
            *) echo "::error::wheel $wheel does not match tag $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/dolmos --version
          /tmp/smoke/bin/python -Ic 'import dolmos'

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/dolmos/
    permissions:
      # mandatory for Trusted Publishing
      # https://docs.pypi.org/trusted-publishers/using-a-publisher/
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release-assets:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Attach the distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
